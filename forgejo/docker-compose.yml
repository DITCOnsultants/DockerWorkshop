services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:${FORGEJO_VERSION:-10}
    container_name: forgejo
    restart: unless-stopped
    environment:
      USER_UID: "${FORGEJO_UID:-1000}"
      USER_GID: "${FORGEJO_GID:-1000}"
      FORGEJO__server__ROOT_URL: ${FORGEJO_ROOT_URL:-http://localhost:3000}
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__DOMAIN: ${FORGEJO_DOMAIN:-localhost}
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__database__PATH: /data/gitea/forgejo.db
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__security__SECRET_KEY: ${FORGEJO_SECRET_KEY}
      FORGEJO__security__INTERNAL_TOKEN: ${FORGEJO_INTERNAL_TOKEN}
      FORGEJO__actions__ENABLED: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      FORGEJO__log__LEVEL: ${FORGEJO_LOG_LEVEL:-warn}
    volumes:
      - ./forgejo-data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${FORGEJO_HTTP_PORT:-3000}:3000"
      - "${FORGEJO_SSH_PORT:-2222}:22"
    networks:
      - forgejo-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  forgejo-init:
    image: codeberg.org/forgejo/forgejo:${FORGEJO_VERSION:-10}
    container_name: forgejo-init
    restart: "no"
    user: "${FORGEJO_UID:-1000}:${FORGEJO_GID:-1000}"
    depends_on:
      forgejo:
        condition: service_healthy
    environment:
      FORGEJO_URL: http://forgejo:3000
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
      RUNNER_NAME: ${RUNNER_NAME:-default-runner}
      RUNNER_LABELS: ${RUNNER_LABELS:-ubuntu-latest:docker://catthehacker/ubuntu:act-latest}
      SEED_REPO_URL: ${SEED_REPO_URL:-}
    volumes:
      - ./forgejo-data:/data
      - ./forgejo-init.sh:/forgejo-init.sh:ro
    networks:
      - forgejo-net
    entrypoint: ["/bin/bash", "/forgejo-init.sh"]

  forgejo-runner:
    image: code.forgejo.org/forgejo/runner:${RUNNER_VERSION:-6}
    container_name: forgejo-runner
    restart: unless-stopped
    user: "${FORGEJO_UID:-1000}:${FORGEJO_GID:-1000}"
    group_add:
      - "${DOCKER_GID}"
    depends_on:
      forgejo-init:
        condition: service_completed_successfully
    volumes:
      - ./runner-data:/data
      - ./forgejo-data/runner.yaml:/runner.yaml:ro
      - ./forgejo-runner.sh:/forgejo-runner.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - forgejo-net
    entrypoint: ["/bin/bash", "/forgejo-runner.sh"]

networks:
  forgejo-net:
    driver: bridge
